<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbrain - Assistente Virtual</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        
        /* Container Principal */
        .app-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; align-items: center; gap: 15px; }

        /* Campo de Pesquisa */
        .search-box { width: 100%; display: flex; gap: 10px; z-index: 10; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: #fff; font-size: 16px; outline: none; }
        button { padding: 12px 18px; border-radius: 8px; border: none; background: #238636; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #2ea043; }

        /* Face Digital Cyberpunk (Abaixo da Busca) */
        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,212,255,0.15) 0%, rgba(13,17,23,1) 70%);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
            transition: all 0.3s ease;
        }

        /* Efeito de Pulso ao Falar */
        .avatar-container.speaking {
            animation: pulse-glow 0.6s infinite alternate;
            border-color: #00ffaa;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px #00d4ff, inset 0 0 10px #00d4ff; transform: scale(1); }
            100% { box-shadow: 0 0 30px #00ffaa, inset 0 0 20px #00ffaa; transform: scale(1.05); }
        }

        .avatar-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px #00d4ff);
        }

        /* Área de Resultados */
        .results-box { width: 100%; margin-top: 10px; display: flex; flex-direction: column; gap: 10px; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 8px; }
        .card h3 { color: #58a6ff; margin-bottom: 8px; font-size: 18px; }
        .card p { color: #8b949e; line-height: 1.4; }
    </style>
</head>
<body>

<div class="app-container">
    <h1 style="color: #58a6ff; font-size: 24px;">Sandbrain AI</h1>

    <!-- Campo de Pesquisa -->
    <div class="search-box">
        <input type="text" id="termoInput" placeholder="Digite sua pesquisa..." onkeypress="if(event.key==='Enter') realizarPesquisa()">
        <button onclick="realizarPesquisa()">Buscar</button>
    </div>

    <!-- Face Digital (Sempre Abaixo do Campo de Busca) -->
    <div class="avatar-container" id="avatarBox">
        <!-- SVG representando a Malha 3D Cyberpunk -->
        <svg class="avatar-img" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 15 C30 15 20 35 20 60 C20 80 35 90 50 90 C65 90 80 80 80 60 C80 35 70 15 50 15 Z" stroke="#00d4ff" stroke-width="1.5" fill="none"/>
            <path d="M30 45 L45 48 L30 50 Z M70 45 L55 48 L70 50 Z" stroke="#00d4ff" stroke-width="1.5"/>
            <path d="M50 48 L50 65 L45 68 H55" stroke="#00d4ff" stroke-width="1.5"/>
            <path d="M40 78 Q50 83 60 78" stroke="#00ffaa" stroke-width="2" id="avatarMouth"/>
            <!-- Linhas de circuito da malha -->
            <line x1="20" y1="40" x2="5" y2="40" stroke="#00d4ff" stroke-width="1"/>
            <circle cx="5" cy="40" r="2" fill="#00d4ff"/>
            <line x1="80" y1="40" x2="95" y2="40" stroke="#00d4ff" stroke-width="1"/>
            <circle cx="95" cy="40" r="2" fill="#00d4ff"/>
        </svg>
    </div>

    <!-- Área onde os Resultados Aparecem -->
    <div class="results-box" id="resultadosArea"></div>
</div>

<script>
    function falarTexto(texto) {
        if (!('speechSynthesis' in window)) return;
        
        window.speechSynthesis.cancel(); // Parar fala anterior
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.0;

        const avatarBox = document.getElementById('avatarBox');

        // Ativa animação da face digital ao iniciar a fala
        utterance.onstart = () => {
            avatarBox.classList.add('speaking');
        };

        // Remove a animação ao encerrar a fala
        utterance.onend = () => {
            avatarBox.classList.remove('speaking');
        };

        utterance.onerror = () => {
            avatarBox.classList.remove('speaking');
        };

        window.speechSynthesis.speak(utterance);
    }

    async function realizarPesquisa() {
        const input = document.getElementById('termoInput');
        const resultadosArea = document.getElementById('resultadosArea');
        const termo = input.value.trim();

        if (!termo) return;

        resultadosArea.innerHTML = '<div class="card"><p>Buscando informações...</p></div>';

        try {
            const response = await fetch('/api/pesquisar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ termo: termo })
            });

            const data = await response.json();
            resultadosArea.innerHTML = '';

            if (data.resultados && data.resultados.length > 0) {
                let textoParaFalar = "";

                data.resultados.forEach((res, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `<h3>${res.titulo}</h3><p>${res.detalhe}</p>`;
                    resultadosArea.appendChild(card);

                    if (index === 0) textoParaFalar = res.detalhe;
                });

                // Sandbrain fala o primeiro resultado da pesquisa
                falarTexto(textoParaFalar);
            } else {
                resultadosArea.innerHTML = '<div class="card"><p>Nenhum resultado encontrado.</p></div>';
                falarTexto("Nenhum resultado direto encontrado.");
            }
        } catch (error) {
            resultadosArea.innerHTML = '<div class="card"><p>Erro ao conectar ao servidor.</p></div>';
            falarTexto("Erro ao conectar ao servidor.");
        }
    }
</script>

</body>
</html>
